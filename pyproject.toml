[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ops-agent"
version = "0.1.0"
description = "AI Ops Agent — LLM-driven log analysis, alert triage, and live stream watching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ai-ops = "ai_ops_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_ops_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
